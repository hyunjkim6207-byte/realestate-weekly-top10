<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>부동산 뉴스 TOP 10 커버</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    font-family: 'Pretendard', 'Malgun Gothic', '맑은 고딕', 'Apple SD Gothic Neo', sans-serif;
    width: 1200px;
  }

  .cover {
    position: relative;
    width: 1200px;
    padding: 76px 68px 64px;
    background: linear-gradient(135deg, #6ba0ac 0%, #588e9c 45%, #497b8c 100%);
    overflow: hidden;
  }

  .brand-row {
    display: flex;
    align-items: center;
    gap: 24px;
    margin-bottom: 56px;
  }
  .brand-row img { width: 128px; height: 128px; border-radius: 50%; display: block; }

  .cover-title { margin-bottom: 60px; }
  .cover-date {
    font-size: 40px;
    font-weight: 600;
    color: rgba(255,255,255,0.92);
    margin-bottom: 8px;
  }
  .cover-main {
    font-size: 80px;
    font-weight: 900;
    letter-spacing: -1px;
    -webkit-text-stroke: 1.2px #f3d383;
    background: linear-gradient(90deg, #fff6d6 0%, #ffe9a8 55%, #f3d383 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .top3 {
    display: flex;
    flex-direction: column;
    gap: 20px;
    margin-bottom: 48px;
  }
  .top3-card {
    display: flex;
    align-items: center;
    gap: 28px;
    background: rgba(255,255,255,0.97);
    border-radius: 20px;
    padding: 26px 32px;
    box-shadow: 0 10px 28px rgba(0,0,0,0.13);
  }
  .top3-num {
    flex: none;
    width: 68px; height: 68px;
    border-radius: 50%;
    background: linear-gradient(135deg, #eecf95, #c9a15c);
    color: #1c3f5c;
    font-size: 34px;
    font-weight: 800;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .top3-body { display: flex; flex-direction: column; gap: 6px; }
  .top3-head {
    font-size: 37px;
    font-weight: 800;
    color: #14213d;
    line-height: 1.3;
  }
  .top3-sub {
    font-size: 29px;
    color: #6b7280;
  }

  .cover-footer {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    padding-top: 32px;
    border-top: 2px solid rgba(255,255,255,0.2);
  }
  .cover-footer-tag {
    font-size: 23px;
    font-weight: 600;
    color: #ffe9a8;
  }
</style>
</head>
<body>

  <div class="cover">
    <div class="brand-row">
      <img src="../assets/logo_iemhometok.png" alt="이음홈톡" />
    </div>

    <div class="cover-title">
      <div class="cover-date">10월 6일 – 10월 12일</div>
      <div class="cover-main">부동산 주간뉴스 TOP 10</div>
    </div>

    <div class="top3">
      <div class="top3-card">
        <div class="top3-num">1</div>
        <div class="top3-body">
          <div class="top3-head">서울 아파트값 87주 연속 상승 '역대 최장'</div>
          <div class="top3-sub">서대문구 0.36% 최고, 강남3구·용산 4주째 하락</div>
        </div>
      </div>
      <div class="top3-card">
        <div class="top3-num">2</div>
        <div class="top3-body">
          <div class="top3-head">웃돈 줘도 못 구하는 전세…매물 고갈 비상</div>
          <div class="top3-sub">집주인 실거주 확대·대출규제 겹쳐 물량 급감</div>
        </div>
      </div>
      <div class="top3-card">
        <div class="top3-num">3</div>
        <div class="top3-body">
          <div class="top3-head">국토위 국감, 집값·전세난에 여야 한목소리</div>
          <div class="top3-sub">야 "정책 실패" 공세, 여도 "대책 마련" 요구</div>
        </div>
      </div>
    </div>

    <div class="cover-footer">
      <div class="cover-footer-tag">서울·수도권 핵심지 주간 브리핑</div>
    </div>
  </div>

</body>
</html>
